strategy:
  name: orb
  opening_range_minutes: 5      # use first 5-min bar as the OR (Zarattini et al. 2024)
  stop_at_or_opposite: true     # stop = other side of opening range
  target_r_multiple: 3.0        # take profit at 3R, else flatten at close
  flatten_minute_before_close: 5  # flatten N minutes before 16:00 ET
  long_only: false              # allow shorts when OR breaks down
  # ORB is a single-name volatility play. ETFs (SPY/QQQ) have ranges
  # too tight for the strategy and consistently lose money. Universe
  # below biases toward names with documented big intraday moves.
  universe:
    - TSLA
    - NVDA
    - AMD
    - COIN
    - MSTR
    - PLTR
    - MARA
    - RIVN
    - SOFI
    - AFRM
    - GME
    - VG

filter:
  relvol_min: 2.0               # tighter "stocks-in-play" gate
  relvol_lookback_days: 14
  top_n_per_day: null

risk:
  starting_equity: 1000
  risk_per_trade: 0.01
  max_concurrent_positions: 2
  max_position_fraction: 0.5

costs:
  fee_per_side: 0.0
  slippage: 0.0005

backtest:
  start: "2024-01-01"
  end: null
  timeframe: "5Min"
