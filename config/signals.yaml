# Signal-driven bot config: ParraMacro -> TradeIdeas -> tickets

parramacro:
  base_url: https://www.parramacro.com   # canonical host; bare domain 301s and strips bearer
  api_key_env: PARRAMACRO_API_KEY        # which env var holds the bearer token
  poll_interval_seconds: 900             # 15 min; matches GeoRisk refresh cadence
  request_timeout_seconds: 10
  max_retries: 3
  # Per-series staleness limits. Only series listed in a policy's
  # `requires:` block actually gate that policy. The runner ignores
  # any entry no enabled policy needs.
  staleness_max_hours:
    commodities: 36                      # commodity model is daily; 36h tolerance
    georisk: 6                           # bumped from 2h - parramacro's geo cadence drifts
    macro_model: 720                     # macro model fits daily; 30d tolerance

risk:
  starting_equity_fallback: 1000         # used if Alpaca account not reachable
  risk_per_trade: 0.01                   # 1% of equity at the stop
  max_position_fraction: 0.30            # one trade <= 30% of equity
  max_open_positions: 3
  daily_loss_kill_pct: 0.05              # halt new trades if equity down >5% on the day
  per_symbol_cooldown_hours: 24          # don't re-enter same name within N hours

execution:
  mode: ticket_queue                     # "ticket_queue" (manual approve) or "auto"
  paper_only: true                       # never touch live Alpaca account
  ticket_dir: tickets                    # local directory for pending tickets
  audit_log: results/signal_log.csv
  notify_email: ""                       # leave blank to skip email; wire up later

policies:
  - name: gold_directional
    enabled: true
    requires: [commodities]              # which parramacro series this policy needs
    commodity: Gold                      # mixed-case, matches ParraMacro TICKERS
    symbol: GLD                          # ETF traded on Alpaca
    fan_horizon: nearest                 # use Q+1 fan boundaries
    long_threshold: p10                  # enter long when spot < p10
    exit_threshold: p50                  # exit when spot reaches p50 (median)
    stop_band: p2_5                      # stop at p2_5
    long_only: true                      # safe default for $1k account
    execution:
      mode: direction_only               # "direction_only" derives stop/target from venue ATR;
                                         # "model_levels" uses parramacro's absolute fan boundaries
      atr_period: 14
      atr_stop_multiplier: 2.0
      target_r_multiple: 3.0
      atr_lookback_days: 60
